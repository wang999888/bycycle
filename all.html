<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骑迹 | 所有提交信息</title>
  <style>
    :root{--ink:#15251f;--muted:#718078;--cream:#f5f1e8;--paper:#fffdf8;--green:#173f35;--orange:#e8753d;--line:#d9ddd4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--cream);font-family:Georgia,"Times New Roman",serif}
    .page{min-height:100vh;padding:42px clamp(24px,8vw,120px) 64px;background:radial-gradient(circle at 12% 8%,rgba(232,117,61,.2) 0 7%,transparent 7.3%),linear-gradient(145deg,#f5f1e8,#fffdf8 62%,#dbe9dd)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1120px;margin:0 auto 70px}.brand{display:flex;align-items:center;gap:11px;font:700 16px Arial,sans-serif;letter-spacing:.08em}.brand-mark{display:grid;width:34px;height:34px;place-items:center;border:2px solid var(--orange);border-radius:50%;color:var(--orange);font-size:21px}.back-link{color:var(--green);font:700 12px Arial,sans-serif;letter-spacing:.08em;text-decoration:none}.back-link:hover{text-decoration:underline}
    .content{max-width:1120px;margin:0 auto}.eyebrow{margin:0 0 16px;color:var(--orange);font:700 12px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.heading-row{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:32px}.heading-row h1{margin:0;font-size:clamp(40px,6vw,72px);font-weight:400;letter-spacing:-.05em;line-height:.98}.count{color:var(--muted);font:13px Arial,sans-serif}.records{display:grid;gap:14px}.record{display:grid;grid-template-columns:70px 1fr auto;gap:20px;align-items:start;padding:22px 24px;border:1px solid var(--line);background:rgba(255,253,248,.8);cursor:pointer;animation:rise .45s ease both;transition:border-color .2s,transform .2s}.record:hover{border-color:var(--green);transform:translateY(-2px)}.record-number{color:var(--orange);font:700 13px Arial,sans-serif}.record-main h2{margin:0 0 15px;font:700 17px Arial,sans-serif}.record dl{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px 22px;margin:0}.record dt{margin-bottom:5px;color:var(--muted);font:11px Arial,sans-serif}.record dd{margin:0;font:700 14px Arial,sans-serif}.record-time{color:var(--muted);font:11px Arial,sans-serif;white-space:nowrap}.empty{padding:68px 24px;border:1px dashed #b9c5ba;color:var(--muted);text-align:center}.empty h2{margin:0 0 10px;color:var(--ink);font-size:24px;font-weight:400}.empty p{margin:0;font:14px/1.6 Arial,sans-serif}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:28px}.button{height:44px;padding:0 18px;border:1px solid var(--green);border-radius:3px;cursor:pointer;font:700 12px Arial,sans-serif;letter-spacing:.08em}.primary{color:#fff;background:var(--green)}.primary:hover{background:#0e2d25}.secondary{color:var(--green);background:transparent}.secondary:hover{color:#fff;background:var(--green)}
    .modal{display:none;position:fixed;inset:0;z-index:2;place-items:center;padding:24px;background:rgba(21,37,31,.45)}.modal.visible{display:grid}.modal-card{width:min(100%,430px);padding:30px;background:var(--paper);box-shadow:0 18px 50px rgba(21,37,31,.18)}.modal-card h2{margin:0 0 24px;font-size:30px;font-weight:400}.modal-card label{display:block;margin:0 0 7px;font:700 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.modal-card input[type=text]{width:100%;height:46px;margin-bottom:18px;padding:0 12px;border:1px solid var(--line);font:14px Arial,sans-serif}.edit-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 15px;padding:0;border:0}.edit-choice legend{grid-column:1/-1;margin-bottom:5px;font:700 12px Arial,sans-serif}.edit-choice label{display:flex;align-items:center;gap:7px;padding:10px;border:1px solid var(--line);font:13px Arial,sans-serif;letter-spacing:0;text-transform:none;cursor:pointer}.edit-choice input{accent-color:var(--green)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.modal-close{color:var(--muted);border-color:var(--line)}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:720px){.page{padding:28px 18px 42px}.topbar{margin-bottom:52px}.heading-row{display:block}.heading-row h1{margin-bottom:18px}.record{grid-template-columns:34px 1fr}.record-time{grid-column:2}.record dl{grid-template-columns:repeat(2,minmax(100px,1fr))}.actions{justify-content:stretch}.button{flex:1}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">↗</span> 骑迹 / BYCYCLE</div><a class="back-link" href="index.html">返回登记页</a></nav>
    <section class="content"><p class="eyebrow">Archive / All records</p><div class="heading-row"><h1>所有提交信息</h1><span class="count" id="recordCount"></span></div><section class="records" id="records" aria-live="polite"></section><div class="actions"><button class="button secondary" id="clearButton" type="button">清空全部记录</button><a class="button primary" href="index.html">继续提交</a></div></section>
  </main>
  <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><form class="modal-card" id="editForm"><h2 id="editTitle">修改登记信息</h2><label for="editUserNo">用户 No</label><input id="editUserNo" type="text" required><fieldset class="edit-choice"><legend>是否为小孩</legend><label><input type="radio" name="editIsChild" value="是"> 是</label><label><input type="radio" name="editIsChild" value="否"> 否</label></fieldset><fieldset class="edit-choice"><legend>是否是带辅助</legend><label><input type="radio" name="editHasAssist" value="是"> 是</label><label><input type="radio" name="editHasAssist" value="否"> 否</label></fieldset><fieldset class="edit-choice"><legend>是否为带小孩</legend><label><input type="radio" name="editWithChild" value="是"> 是</label><label><input type="radio" name="editWithChild" value="否"> 否</label></fieldset><fieldset class="edit-choice"><legend>是否为有房顶</legend><label><input type="radio" name="editHasRoof" value="是"> 是</label><label><input type="radio" name="editHasRoof" value="否"> 否</label></fieldset><div class="modal-actions"><button class="button modal-close" id="cancelEdit" type="button">取消</button><button class="button primary" type="submit">保存修改</button></div></form></div>
  <script>
    const API_URL=(window.location.protocol==='file:'?'http://localhost:3000':'')+'/api/records',recordsElement=document.querySelector('#records'),countElement=document.querySelector('#recordCount'),clearButton=document.querySelector('#clearButton'),editModal=document.querySelector('#editModal'),editForm=document.querySelector('#editForm'),editUserNo=document.querySelector('#editUserNo');let editingIndex=-1;let recordsCache=[];
    const labels=[['isChild','是否为小孩'],['hasAssist','是否是带辅助'],['withChild','是否为带小孩'],['hasRoof','是否为有房顶']];
    function renderRecords(records){recordsCache=records;const latest=records.slice().reverse();countElement.textContent=`共 ${records.length} 条记录`;clearButton.disabled=records.length===0;recordsElement.innerHTML=latest.length?latest.map((record,index)=>`<article class="record" data-index="${records.length-1-index}" tabindex="0" aria-label="修改用户 ${escapeHtml(record.userNo)} 的登记信息"><span class="record-number">${String(index+1).padStart(2,'0')}</span><div class="record-main"><h2>用户 No · ${escapeHtml(record.userNo)}</h2><dl>${labels.map(([key,label])=>`<div><dt>${label}</dt><dd>${escapeHtml(record[key])}</dd></div>`).join('')}</dl></div><time class="record-time">${escapeHtml(record.submittedAt||'')}</time></article>`).join(''):'<div class="empty"><h2>还没有提交记录</h2><p>完成一次登记后，确认提交的信息会显示在这里。</p></div>'}
    function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
    function openEditor(index){const record=recordsCache[index];if(!record)return;editingIndex=index;editUserNo.value=record.userNo;labels.forEach(([key])=>{document.querySelector(`input[name="edit${key.charAt(0).toUpperCase()+key.slice(1)}"][value="${record[key]}"]`).checked=true});editModal.classList.add('visible');editUserNo.focus()}
    recordsElement.addEventListener('click',event=>{const record=event.target.closest('.record');if(record)openEditor(Number(record.dataset.index))});recordsElement.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.classList.contains('record')){event.preventDefault();openEditor(Number(event.target.dataset.index))}});
    editForm.addEventListener('submit',async event=>{event.preventDefault();if(!editUserNo.value.trim()||editingIndex<0)return;const record={...recordsCache[editingIndex],userNo:editUserNo.value.trim(),isChild:document.querySelector('input[name="editIsChild"]:checked').value,hasAssist:document.querySelector('input[name="editHasAssist"]:checked').value,withChild:document.querySelector('input[name="editWithChild"]:checked').value,hasRoof:document.querySelector('input[name="editHasRoof"]:checked').value};try{const response=await fetch(`${API_URL}/${editingIndex}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)});if(!response.ok)throw new Error('修改失败');recordsCache[editingIndex]=record;editModal.classList.remove('visible');renderRecords(recordsCache)}catch(error){alert('服务器保存失败，请检查网络连接。')}});
    document.querySelector('#cancelEdit').addEventListener('click',()=>editModal.classList.remove('visible'));editModal.addEventListener('click',event=>{if(event.target===editModal)editModal.classList.remove('visible')});clearButton.addEventListener('click',async()=>{if(!recordsCache.length)return;if(confirm('确定清空所有提交记录吗？')){const response=await fetch(API_URL,{method:'DELETE',cache:'no-store'});if(response.ok)renderRecords([])}});async function loadRecords(){try{const response=await fetch(API_URL,{cache:'no-store'});if(!response.ok)throw new Error('读取失败');if(!editModal.classList.contains('visible'))renderRecords(await response.json())}catch(error){if(!editModal.classList.contains('visible'))recordsElement.innerHTML='<div class="empty"><h2>暂时无法读取记录</h2><p>请检查服务器接口地址和网络连接。</p></div>'}}loadRecords();window.setInterval(loadRecords,3000);
  </script>
</body>
</html>
