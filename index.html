<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>骑迹 | 登录信息</title>
	<style>
		:root{--ink:#15251f;--muted:#718078;--cream:#f5f1e8;--paper:#fffdf8;--green:#173f35;--orange:#e8753d;--line:#d9ddd4}
		*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--cream);font-family:Georgia,"Times New Roman",serif}
		.page{display:grid;grid-template-columns:minmax(360px,.95fr) minmax(500px,1.05fr);min-height:100vh;overflow:hidden}
		.story{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:40px clamp(32px,6vw,92px) 42px;color:#f6f3ea;background:radial-gradient(circle at 22% 20%,rgba(232,117,61,.28) 0 8%,transparent 8.4%),linear-gradient(145deg,#173f35 0%,#245546 58%,#467461 100%)}
		.story:before,.story:after{content:"";position:absolute;border:1px solid rgba(244,236,215,.18);border-radius:50%;pointer-events:none}.story:before{width:520px;height:520px;right:-250px;top:11%}.story:after{width:310px;height:310px;left:-180px;bottom:12%}
		.brand,.story-copy,.story-foot{position:relative;z-index:1}.brand{display:flex;align-items:center;gap:11px;font:700 16px Arial,sans-serif;letter-spacing:.08em}.brand-mark{display:grid;width:34px;height:34px;place-items:center;border:2px solid var(--orange);border-radius:50%;color:var(--orange);font-size:21px;line-height:1}
		.story-copy{max-width:500px;margin:auto 0;padding:10vh 0}.eyebrow{margin:0 0 22px;color:#f4aa79;font:700 12px/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}h1{max-width:570px;margin:0 0 24px;font-size:clamp(46px,6vw,84px);font-weight:400;letter-spacing:-.045em;line-height:.96}.story-copy p{max-width:370px;margin:0;color:#d3dfd4;font-size:18px;line-height:1.65}.story-foot{display:flex;justify-content:space-between;gap:20px;color:#b9cdbd;font:12px Arial,sans-serif;letter-spacing:.04em}
		.login-area{display:grid;place-items:center;padding:48px clamp(30px,8vw,120px);background:var(--paper)}.login-card{width:min(100%,390px);animation:rise .7s ease both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.login-card header{margin-bottom:38px}.login-card h2{margin:0 0 10px;font-size:39px;font-weight:400;letter-spacing:-.035em}.login-card header p{margin:0;color:var(--muted);font:14px/1.6 Arial,sans-serif}
		.field{margin-bottom:21px}label{display:block;margin-bottom:9px;font:700 12px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}.input-wrap{position:relative}input{width:100%;height:52px;padding:0 15px;border:1px solid var(--line);border-radius:3px;outline:0;color:var(--ink);background:#fff;font:15px Arial,sans-serif;transition:border-color .2s,box-shadow .2s}input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,63,53,.1)}input.invalid{border-color:var(--orange)}.password-input{padding-right:48px}.toggle-password{position:absolute;top:50%;right:13px;padding:5px;border:0;color:var(--muted);background:transparent;cursor:pointer;font:12px Arial,sans-serif}.toggle-password:hover{color:var(--ink)}.error{min-height:16px;margin:6px 0 0;color:#bd4c26;font:12px Arial,sans-serif}
		.options{display:flex;align-items:center;justify-content:space-between;margin:2px 0 27px;font:13px Arial,sans-serif}.remember{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer}.remember input{width:15px;height:15px;accent-color:var(--green)}.options a{color:var(--green);text-decoration:none;border-bottom:1px solid #a7bdb0}.options a:hover{border-color:var(--green)}
		.submit{width:100%;height:54px;border:0;border-radius:3px;color:#fffdf8;background:var(--green);cursor:pointer;font:700 13px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,transform .2s}.submit:hover{background:#0e2d25;transform:translateY(-1px)}.submit:disabled{cursor:wait;opacity:.7;transform:none}.success{min-height:20px;margin:13px 0 0;color:var(--green);font:13px Arial,sans-serif;text-align:center}.signup{margin:34px 0 0;color:var(--muted);font:13px Arial,sans-serif;text-align:center}.signup a{color:var(--green);font-weight:700;text-decoration:none}
		.summary{display:none;margin-top:24px;padding:18px 20px;border-top:1px solid var(--line);background:#f8f6ef}.summary.visible{display:block}.summary h3{margin:0 0 13px;color:var(--green);font:700 12px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}.summary dl{display:grid;grid-template-columns:1fr auto;gap:9px 16px;margin:0;font:13px/1.4 Arial,sans-serif}.summary dt{color:var(--muted)}.summary dd{margin:0;color:var(--ink);font-weight:700}
		.login-card.submitted>header,.login-card.submitted>.field,.login-card.submitted>.choice-group,.login-card.submitted>.submit,.login-card.submitted>.success{display:none}.login-card.submitted .summary{margin-top:0;padding:0;border-top:0;background:transparent}.summary-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.edit-button,.confirm-button,.continue-button,.close-button{height:45px;border:1px solid var(--green);border-radius:3px;cursor:pointer;font:700 12px Arial,sans-serif;letter-spacing:.1em}.edit-button,.continue-button{color:var(--green);background:transparent}.edit-button:hover,.continue-button:hover{color:#fff;background:var(--green)}.confirm-button,.continue-button{color:#fff;background:var(--green)}.confirm-button:hover,.continue-button:hover{background:#0e2d25}.complete-message{display:none;margin:24px 0 0;color:var(--green);font:700 14px Arial,sans-serif;text-align:center}.complete-message.visible{display:block}.summary.confirmed .summary-actions{display:none}.complete-actions{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.summary.confirmed .complete-actions{display:grid}.close-button{color:var(--muted);border-color:var(--line);background:transparent}.close-button:hover{color:var(--ink);border-color:var(--ink)}.closed-message{display:none;margin-top:24px;color:var(--muted);font:13px Arial,sans-serif;text-align:center}.closed-message.visible{display:block}
		.all-link{display:block;margin-top:18px;color:var(--green);font:700 12px Arial,sans-serif;text-align:center;text-decoration:none}.all-link:hover{text-decoration:underline}
		@media(max-width:780px){.page{display:block}.story{min-height:42vh;padding:27px 28px}.story-copy{padding:55px 0 40px}.story-copy p{font-size:16px}h1{font-size:clamp(44px,13vw,67px)}.story-foot{display:none}.login-area{min-height:58vh;padding:46px 28px 56px}}
	</style>
</head>
<body>
	<main class="page">
		<section class="story" aria-label="骑迹介绍"><div class="brand"><span class="brand-mark" aria-hidden="true">↗</span> 骑迹 / BYCYCLE</div><div class="story-copy"><p class="eyebrow">Ride further · Live closer</p><h1>每一段路，<br>都有迹可循。</h1><p>填写本次骑行的登录信息，让每一次出发都被认真记录。</p></div><div class="story-foot"><span>EST. 2024 / SHANGHAI</span><span>01 — 06</span></div></section>
		<section class="login-area"><form class="login-card" id="loginForm" novalidate><header><h2>登录信息</h2><p>请填写用户信息，继续你的骑行记录。</p></header><div class="field"><label for="userNo">用户 No</label><input id="userNo" name="userNo" type="text" placeholder="输入用户 No"><p class="error" id="userNoError" aria-live="polite"></p></div><fieldset class="choice-group"><legend>是否为小孩</legend><label><input type="radio" name="isChild" value="是"> 是</label><label><input type="radio" name="isChild" value="否" checked> 否</label></fieldset><fieldset class="choice-group"><legend>是否是带辅助</legend><label><input type="radio" name="hasAssist" value="是"> 是</label><label><input type="radio" name="hasAssist" value="否" checked> 否</label></fieldset><fieldset class="choice-group"><legend>是否为带小孩</legend><label><input type="radio" name="withChild" value="是"> 是</label><label><input type="radio" name="withChild" value="否" checked> 否</label></fieldset><fieldset class="choice-group"><legend>是否为有房顶</legend><label><input type="radio" name="hasRoof" value="是"> 是</label><label><input type="radio" name="hasRoof" value="否" checked> 否</label></fieldset><button class="submit" type="submit" id="submitButton">提交登录信息</button><p class="success" id="successMessage" aria-live="polite"></p><section class="summary" id="summary" aria-live="polite"><h3>登记信息一览</h3><dl><dt>用户 No</dt><dd id="summaryUserNo"></dd><dt>是否为小孩</dt><dd id="summaryIsChild"></dd><dt>是否是带辅助</dt><dd id="summaryHasAssist"></dd><dt>是否为带小孩</dt><dd id="summaryWithChild"></dd><dt>是否为有房顶</dt><dd id="summaryHasRoof"></dd></dl><div class="summary-actions"><button class="edit-button" type="button" id="editButton">返回修改</button><button class="confirm-button" type="button" id="confirmButton">确认提交</button></div><p class="complete-message" id="completeMessage" aria-live="polite">提交完成</p><div class="complete-actions"><button class="continue-button" type="button" id="continueButton">继续提交</button><button class="close-button" type="button" id="closeButton">关闭</button></div><a class="all-link" href="all.html">查看所有提交信息</a><p class="closed-message" id="closedMessage" aria-live="polite">本次登记已关闭</p></section></form></section>
	</main>
	<script>
		const API_URL='https://script.google.com/macros/s/AKfycbxGalDaDrPd3V_QcrGUsyNSs14VEYrJfw0nFTV3Z0IorkWGA4WQkhzCS7cq1mY6nI6skQ/exec';
		const form=document.querySelector('#loginForm'),userNo=document.querySelector('#userNo'),userNoError=document.querySelector('#userNoError'),successMessage=document.querySelector('#successMessage'),submitButton=document.querySelector('#submitButton'),summary=document.querySelector('#summary');
		form.addEventListener('submit',event=>{event.preventDefault();const message=userNo.value.trim()?'':'请输入用户 No';userNo.classList.toggle('invalid',Boolean(message));userNoError.textContent=message;successMessage.textContent='';if(message){userNo.focus();return}submitButton.disabled=true;submitButton.textContent='提交中...';window.setTimeout(()=>{submitButton.disabled=false;submitButton.textContent='提交登录信息';successMessage.textContent=`用户 ${userNo.value.trim()} 的登录信息已提交。`;document.querySelector('#summaryUserNo').textContent=userNo.value.trim();document.querySelector('#summaryIsChild').textContent=document.querySelector('input[name="isChild"]:checked').value;document.querySelector('#summaryHasAssist').textContent=document.querySelector('input[name="hasAssist"]:checked').value;document.querySelector('#summaryWithChild').textContent=document.querySelector('input[name="withChild"]:checked').value;document.querySelector('#summaryHasRoof').textContent=document.querySelector('input[name="hasRoof"]:checked').value;summary.classList.add('visible');form.classList.add('submitted');summary.scrollIntoView({behavior:'smooth',block:'center'})},650)});
		const editButton=document.querySelector('#editButton'),confirmButton=document.querySelector('#confirmButton'),completeMessage=document.querySelector('#completeMessage'),continueButton=document.querySelector('#continueButton'),closeButton=document.querySelector('#closeButton'),closedMessage=document.querySelector('#closedMessage');
		document.querySelector('#editButton').addEventListener('click',()=>{form.classList.remove('submitted');summary.classList.remove('visible','confirmed');completeMessage.classList.remove('visible');successMessage.textContent='';userNo.focus()});
		confirmButton.addEventListener('click',()=>{const record={userNo:userNo.value.trim(),isChild:document.querySelector('input[name="isChild"]:checked').value,hasAssist:document.querySelector('input[name="hasAssist"]:checked').value,withChild:document.querySelector('input[name="withChild"]:checked').value,hasRoof:document.querySelector('input[name="hasRoof"]:checked').value,submittedAt:new Date().toLocaleString('zh-CN')};confirmButton.disabled=true;confirmButton.textContent='提交中...';const queued=navigator.sendBeacon(API_URL,new Blob([JSON.stringify(record)],{type:'text/plain'}));if(!queued){successMessage.textContent='服务器提交失败，请检查网络连接。';confirmButton.disabled=false;confirmButton.textContent='确认提交';return}confirmButton.disabled=false;confirmButton.textContent='确认提交';summary.classList.add('confirmed');completeMessage.classList.add('visible')});
		continueButton.addEventListener('click',()=>{form.reset();form.classList.remove('submitted');summary.classList.remove('visible','confirmed');completeMessage.classList.remove('visible');closedMessage.classList.remove('visible');successMessage.textContent='';userNo.focus()});
		closeButton.addEventListener('click',()=>{summary.classList.remove('confirmed');completeMessage.classList.remove('visible');closedMessage.classList.add('visible')});
	</script>
</body>
</html>
